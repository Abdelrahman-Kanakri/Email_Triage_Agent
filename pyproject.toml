[project]
name = "3-email-triage-agent"
version = "0.1.0"
description = "LangGraph email triage agent with prompt-injection guard and human-in-the-loop approval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "langchain>=1.3.14",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.10.6",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "sse-starlette>=3.4.5",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    # Third-party: starlette's TestClient nudging toward httpx2. Not our code.
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
